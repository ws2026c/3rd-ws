apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: Bottlerocket
  role: KarpenterNodeRole-test-eks
  amiSelectorTerms:
    - alias: bottlerocket@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: apdev-eks-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: apdev-eks-cluster
